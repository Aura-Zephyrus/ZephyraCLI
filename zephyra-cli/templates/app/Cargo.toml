[package]
name = "{{NAME}}"
version = "0.1.0"
edition = "2021"
publish = false

# 默认后端按平台选：Windows 走 D3D12（功能最全），其它平台走 Vulkan。
# 切换：`cargo run --no-default-features --features d3d11`（Windows）
#       `cargo run --no-default-features --features vulkan`
[features]
default = ["{{DEFAULT_FEATURE}}"]
d3d12 = ["dep:zephyra-winit-d3d12"]
d3d11 = ["dep:zephyra-winit"]
vulkan = ["dep:zephyra-vulkan"]
# `zephyra build --sf` 会传这个 feature：样式表内嵌进 exe
sf = []

# 所有 Zephyra 库（core / 编译器栈 / fx / 三后端）统一来自独立仓 ZephyraCore。
# 不需要任何本地 checkout —— 同一来源，不会因 path/git 混用而在 lockfile 冲突。
[dependencies]
zephyra-core = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", tag = "v0.2.0" }
zephyra-style = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", tag = "v0.2.0" }
zstyle-compile = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", tag = "v0.2.0" }
zephyra-fx = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", tag = "v0.2.0" }
winit = "0.30"
zephyra-winit-d3d12 = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", tag = "v0.2.0", optional = true }
zephyra-winit = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", tag = "v0.2.0", optional = true }
zephyra-vulkan = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", tag = "v0.2.0", optional = true }
