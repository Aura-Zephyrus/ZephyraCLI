[package]
name = "{{NAME}}"
version = "0.1.0"
edition = "2021"
publish = false

# 默认后端按平台选：Windows 走 D3D12（功能最全），其它平台走 Vulkan。
# 切换：`cargo run --no-default-features --features d3d11`（Windows）
#       `cargo run --no-default-features --features vulkan`
[features]
default = ["{{DEFAULT_FEATURE}}"]
d3d12 = ["dep:zephyra-winit-d3d12"]
d3d11 = ["dep:zephyra-winit"]
vulkan = ["dep:zephyra-vulkan"]
# `zephyra build --sf` 会传这个 feature：样式表内嵌进 exe。
sf = []

[dependencies]
zephyra-core = { path = "{{DEP_CORE}}" }
zephyra-fx = { path = "{{DEP_FX}}" }
zephyra-style = { path = "{{DEP_STYLE}}" }
zstyle-compile = { path = "{{DEP_ZSTYLE}}" }
winit = "0.30"
zephyra-winit-d3d12 = { path = "{{DEP_D3D12}}", optional = true }
zephyra-winit = { path = "{{DEP_D3D11}}", optional = true }
zephyra-vulkan = { path = "{{DEP_VULKAN}}", optional = true }
