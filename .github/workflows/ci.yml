name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout ZephyraCLI
        uses: actions/checkout@v4
        with:
          path: ZephyraCLI


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ZephyraCLI

      # CLI 的退出码与错误文案被测试钉死，这三个门禁一个都不能少。
      - name: rustfmt
        working-directory: ZephyraCLI
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: ZephyraCLI
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        working-directory: ZephyraCLI
        run: cargo test --workspace --all-targets

      # debug 编译过不代表 release 能过（cfg(debug_assertions) 在两边不同）。
      - name: release build
        working-directory: ZephyraCLI
        run: cargo build --release --workspace
